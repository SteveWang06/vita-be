server:
  port: 8083
  servlet:
    context-path: /post


spring:
  datasource:
    url: ${DBMS_CONNECTION:jdbc:mysql://localhost:3306/post_service_db}
    driverClassName: "com.mysql.cj.jdbc.Driver"
    username: ${DBMS_USERNAME:root}
    password: ${DBMS_PASSWORD:password}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

