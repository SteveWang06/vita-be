server:
  port: 8080

app:
  api-prefix: /api/v1

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user_service
          uri: http://localhost:8081
          predicates:
            - Path=${app.api-prefix}/user/**
          filters:
            - StripPrefix=2
        - id: auth_service
          uri: http://localhost:8082
          predicates:
            - Path=${app.api-prefix}/auth/**
          filters:
            - StripPrefix=2