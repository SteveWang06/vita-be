server:
  port: 8080
  # Connection and timeout configuration for DDoS protection
  netty:
    connection-timeout: 10s
    idle-timeout: 30s
  http2:
    enabled: true
  compression:
    enabled: true

app:
  api-prefix: /api/v1
  
  # Enhanced Rate limiting configuration with DDoS protection
  rate-limit:
    # Different limits for anonymous vs authenticated users
    anonymous:
      requests-per-minute: 60        # Lower limit for anonymous users
    authenticated:
      requests-per-minute: 200       # Higher limit for authenticated users
    cleanup-interval-minutes: 5      # Cleanup expired entries every 5 minutes
  
  # Cache configuration
  cache:
    token-ttl: 300 # 5 minutes in seconds
  
  # Enhanced Security configuration with DDoS protection
  security:
    # CORS configuration
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:8080"
    allowed-methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    
    # IP Blocking configuration
    ip-blocking:
      enabled: true
      max-violations: 10             # Auto-block after 10 violations
      whitelist:                      # Trusted IPs that bypass all checks
        - "127.0.0.1"
        - "::1"
        # Add your trusted IPs here
      blacklist:                      # Permanently blocked IPs
        # Add malicious IPs here
    
    # Request Validation configuration
    request-validation:
      enabled: true
      max-request-size: 10485760    # 10 MB
      max-url-length: 2048          # Maximum URL length
      max-header-size: 8192         # Maximum total header size (8 KB)
      max-headers-count: 50         # Maximum number of headers
  
  # Admin account configuration
  admin:
    username: admin
    password: admin123
    email: admin@vita.com

spring:
  application:
    name: api-gateway
  
  cloud:
    gateway:
      # Routes are configured in Java (GatewayConfig.java)
      # Global CORS configuration
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: ${app.security.allowed-origins}
            allowedMethods: ${app.security.allowed-methods}
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      
      # HTTP client configuration for DDoS protection
      httpclient:
        connect-timeout: 5000         # Connection timeout (ms)
        response-timeout: 10s         # Response timeout
        pool:
          type: elastic
          max-connections: 500        # Max concurrent connections
          max-idle-time: 30s
          max-life-time: 60s
  
  cache:
    type: simple
    cache-names:
      - token-cache
  
  # Task scheduler configuration
  task:
    scheduling:
      pool:
        size: 5                       # Thread pool size for scheduled tasks

# Circuit Breaker configuration
resilience4j:
  circuitbreaker:
    instances:
      authService:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 3
  ratelimiter:
    instances:
      authService:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 1s

logging:
  level:
    org.springframework.cloud.gateway: DEBUG     # Changed to DEBUG for troubleshooting
    org.springframework.web.reactive: DEBUG      # Changed to DEBUG for troubleshooting
    reactor.netty: INFO                          # Keep INFO
    com.vita.api_gateway.filter: DEBUG           # Our custom filters - DEBUG
    com.vita.api_gateway.service: DEBUG          # Our services - DEBUG
    com.vita.api_gateway: DEBUG                  # All our code - DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/api-gateway.log
    max-size: 10MB
    max-history: 30

# Swagger/OpenAPI configuration for WebFlux
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false