server:
  port: 8085

spring:
  application:
    name: media-service

  datasource:
    url: jdbc:mysql://localhost:3306/media_service_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# AWS S3 Configuration
aws:
  s3:
    access-key: ${AWS_S3_ACCESS_KEY:YOUR_AWS_ACCESS_KEY}
    secret-key: ${AWS_S3_SECRET_KEY:YOUR_AWS_SECRET_KEY}
    region: ${AWS_S3_REGION:ap-southeast-1}
    bucket-name: ${AWS_S3_BUCKET_NAME:vita-media-bucket}
    presigned-url-expiration: 3600  # 1 hour in seconds
    base-url: https://${aws.s3.bucket-name}.s3.${aws.s3.region}.amazonaws.com

# File Upload Limits
file:
  upload:
    max-size-image: 10485760      # 10MB for images
    max-size-video: 104857600     # 100MB for videos
    allowed-image-types:
      - image/jpeg
      - image/jpg
      - image/png
      - image/webp
      - image/gif
    allowed-video-types:
      - video/mp4
      - video/mpeg
      - video/quicktime
      - video/x-msvideo
      - video/webm

# Logging
logging:
  level:
    com.vita.media_service: INFO
    org.springframework.web: INFO
    org.hibernate: INFO

# Swagger/OpenAPI configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false

