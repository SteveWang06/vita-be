server:
  port: 8081
  servlet:
    context-path: /user


spring:
  datasource:
    url: ${DBMS_CONNECTION:jdbc:mysql://localhost:3306/user_service_db}
    driverClassName: "com.mysql.cj.jdbc.Driver"
    username: ${DBMS_USERNAME:root}
    password: ${DBMS_PASSWORD:password}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# Swagger/OpenAPI configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false

